[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "starskill"
version = "0.1.0"
description = "AI-ready astronomy practical training skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy==7.2.0",
    "astroquery==0.4.11",
    "matplotlib==3.10.9",
    "numpy==2.4.2",
    "pydantic>=2.10,<3",
    "tzdata>=2025.2",
]

[project.scripts]
starskill = "starskill.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]
validation = [
    "skyfield==1.53",
    "skyfield-data==6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
